[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
# src/* is the pre-migration TypeScript source (no .py files there anyway).
# field_quality.py is a pre-existing, unrelated manual diagnostic script,
# not part of the crawler service itself.
omit = ["tests/*", "src/*", "field_quality.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
